# RoScout shared data: records player counts for Roblox's top games every 30 minutes.
# Output goes to the "data" branch (one commit, replaced on every save), which every RoScout install reads.
#
# GitHub only starts scheduled workflows when it has spare capacity (in practice a couple of times
# a day for this repo), so one run stays on for about 5.5 hours, recording every half hour, and then
# starts the next run itself. The hourly schedule only matters if that chain ever breaks.
name: Collect player counts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/**', 'watch.json', '.github/workflows/collect.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get the current data
        run: |
          git clone --quiet --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" data || mkdir -p data
          rm -rf data/.git

      - name: Record every 30 minutes for about 5.5 hours
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stop=$(( $(date +%s) + 330 * 60 ))
          publish() {
            ( cd data && rm -rf .git && git init --quiet -b data && git add -A &&
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --quiet -m "Player counts $(date -u +%Y-%m-%dT%H:%MZ)" &&
              git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data ) \
              || echo "::warning::publish failed, will retry next round"
          }
          while :; do
            node collector/collect.mjs data watch.json && publish || echo "::warning::this round failed"
            now=$(date +%s)
            next=$(( (now / 1800 + 1) * 1800 + 60 ))   # one minute past the next :00 or :30
            [ "$next" -ge "$stop" ] && break
            sleep $(( next - now ))
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run collect.yml --ref main --repo "$GITHUB_REPOSITORY"
